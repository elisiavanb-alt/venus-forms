<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Medical History | Venus Egg Donation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- Jotform Custom Widget API (only active when this page runs inside your Jotform) -->
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<style>
/*
  BRAND SETTINGS
  Kripa is the Venus brand font. If you host the Kripa font file, add an @font-face rule here, e.g.:
  @font-face { font-family: "Kripa"; src: url("https://YOUR-SITE/fonts/Kripa.woff2") format("woff2"); font-display: swap; }
  Colors: --peri is the light periwinkle from the logo. --brand is a deeper periwinkle used for text and buttons
  so everything meets WCAG AA contrast on white.
*/
:root{
  --font-head:"Kripa","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --peri:#B9C3F2;
  --peri-soft:#EEF1FD;
  --peri-mid:#DCE1FA;
  --brand:#4A55A8;
  --brand-dark:#353F8C;
  --text:#1E2238;
  --muted:#4E546E;
  --border:#C5CAE0;
  --bg:#FFFFFF;
  --danger:#B42318;
  --danger-bg:#FEF3F2;
  --success:#2F6B3E;
  --radius:14px;
  --focus:0 0 0 3px #FFFFFF,0 0 0 6px #353F8C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1,h2,h3{font-family:var(--font-head);color:var(--text);line-height:1.25;margin:0}
h1{font-size:1.6rem;margin:4px 0 14px}
h1:focus{outline:none}
h2{font-size:1.2rem;margin:28px 0 10px}
h3{font-size:1.05rem}
p{margin:0 0 12px}
.eyebrow{font-size:.85rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);margin:0}
.progress{height:8px;background:var(--peri-mid);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.progress span{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .25s}
.lead{font-size:1.05rem;color:var(--text);font-weight:600;margin:4px 0 16px}
.muted{color:var(--muted)}
.hint{font-size:.9rem;color:var(--muted);margin:-2px 0 8px}
.opt{font-weight:400;color:var(--muted);font-size:.9rem}
.card-intro{background:var(--peri-soft);border:1px solid var(--peri-mid);border-radius:var(--radius);padding:18px;margin:8px 0 22px}

/* Buttons */
button{font-family:inherit;font-size:1rem;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.check input:focus-visible+span{outline:none;box-shadow:var(--focus)}
.btn{min-height:48px;padding:10px 22px;border-radius:999px;border:2px solid var(--brand);background:var(--brand);color:#fff;font-weight:700;line-height:1.2}
.btn:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.secondary{background:#fff;color:var(--brand)}
.btn.secondary:hover{background:var(--peri-soft)}
.btn[aria-disabled="true"]{background:#E4E6EF;border-color:#E4E6EF;color:#5B6078;cursor:not-allowed}
.btn.block{width:100%}
.btn.small{min-height:44px;padding:8px 16px;font-size:.95rem}
.linkbtn{background:none;border:none;color:var(--brand);font-weight:700;text-decoration:underline;min-height:44px;padding:8px 4px}
.linkbtn.danger{color:var(--danger)}
.nav{display:flex;gap:12px;justify-content:space-between;margin-top:28px;padding-top:18px;border-top:1px solid var(--border)}
.nav .btn{flex:1}

/* Pills */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{flex:1 1 0;min-width:84px;min-height:44px;padding:8px 12px;border-radius:999px;border:2px solid var(--border);background:#fff;color:var(--text);font-weight:600;line-height:1.2}
.pill:hover{border-color:var(--brand)}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pills.stack{flex-direction:column}
.pills.stack .pill{flex:none;width:100%;text-align:left;border-radius:12px;padding:12px 16px}
.pills.wrap .pill{flex:0 1 auto}
.pill .tick{display:none}
.pill.on .tick{display:inline}

/* Fields */
.q{margin:0 0 18px}
.q-label{display:block;font-weight:700;margin:0 0 8px}
input[type=text],input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 14px;border:2px solid var(--border);border-radius:12px;font-family:inherit;font-size:1rem;color:var(--text);background:#fff}
textarea{min-height:96px;resize:vertical}
input:disabled{background:#F2F3F8;color:#6B7088}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.check{display:flex;align-items:flex-start;gap:12px;min-height:44px;padding:10px 0;cursor:pointer;font-weight:600}
.check input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--brand);margin-top:1px}
.row-num{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row-num input[type=number]{max-width:140px}

/* Relative cards */
.relcard{border:1px solid var(--border);border-radius:var(--radius);margin:0 0 10px;background:#fff}
.relcard.missing{border-color:var(--danger)}
.relhead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:12px 16px;background:none;border:none;text-align:left;color:var(--text);border-radius:var(--radius)}
.relhead .t{font-weight:800}
.relhead .s{display:block;font-size:.9rem;color:var(--muted);font-weight:600}
.relhead .s.todo{color:var(--danger)}
.chev{flex:none;width:12px;height:12px;border-right:3px solid var(--brand);border-bottom:3px solid var(--brand);transform:rotate(45deg);margin-right:4px;transition:transform .2s}
.relhead[aria-expanded="true"] .chev{transform:rotate(-135deg)}
.relbody{padding:4px 16px 12px;border-top:1px solid var(--peri-mid)}
.group-label{font-weight:800;margin:22px 0 10px;color:var(--brand-dark)}

/* Conditions */
.noall{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:12px;border:2px dashed var(--brand);background:var(--peri-soft);color:var(--brand-dark);font-weight:800;margin:4px 0 12px}
.noall[aria-pressed="true"]{border-style:solid;background:var(--brand);color:#fff}
.counter{font-weight:700;color:var(--muted);margin:0 0 14px}
.cond{border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:0 0 12px;background:#fff}
.cond.unanswered{border-color:var(--danger);background:var(--danger-bg)}
.cond-label{font-weight:700;margin:0 0 10px}
.panel{margin-top:14px;padding:14px;border-radius:12px;background:var(--peri-soft);border:1px solid var(--peri-mid)}
.entry{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin:0 0 12px}
.entry .pill{min-width:0;padding:8px 10px;font-size:.95rem}
.entry-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px}
.entry-head h3{font-size:1rem;color:var(--brand-dark)}
.gentle{font-size:.95rem;color:var(--muted);margin:0 0 12px}
.alert{border-radius:12px;padding:14px 16px;margin:14px 0;font-weight:600}
.alert.warn{background:var(--danger-bg);border:1px solid #F4C7C3;color:#7A1A12}
.alert.info{background:var(--peri-soft);border:1px solid var(--peri-mid);color:var(--text)}
.alert.ok{background:#EEF7F0;border:1px solid #BFDCC6;color:var(--success)}
.alert ul{margin:8px 0 0;padding-left:20px}
.alert li{margin:4px 0}
.alert a,.review a{color:inherit}

/* Review */
.rsec{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:0 0 12px}
.rsec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rsec-head h3{font-size:1rem}
.rsec ul{margin:8px 0 0;padding-left:20px}
.rsec li{margin:6px 0}
.rmiss{color:var(--danger);font-weight:700}
.tag{display:inline-block;font-size:.8rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--peri-mid);color:var(--brand-dark);margin-right:6px}
.tag.unsure{background:#FFF4D6;color:#6B4A00}
.footnote{font-size:.9rem;color:var(--muted);margin-top:18px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
@media (min-width:600px){main{padding-top:28px}h1{font-size:1.9rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    h += '<p class="muted">Please review your answers. Use "Edit" to make changes. Anything still unanswered is shown in red.</p>';
    if (iss.length) {
      h += '<div class="alert warn" role="alert" id="issues">' + iss.length + (iss.length === 1 ? ' item needs' : ' items need') + ' an answer before you can submit:<ul>' +
        iss.map(function (i) { return '<li><a href="#" data-act="goto" data-step="' + i.step + '" data-target="' + i.id + '"' + (i.card ? ' data-card="' + i.card + '"' : '') + '>Section ' + i.step + ': ' + esc(i.text) + '</a></li>'; }).join('') + '</ul></div>';
    }
    // Section 1
    var s1 = S.s1;
    h += '<div class="rsec"><div class="rsec-head"><h3>1. Your Biological Family</h3>' + editLink(1, 'Section 1') + '</div><ul>';
    h += '<li>' + (s1.knowledge ? esc(lbl(KNOWLEDGE, s1.knowledge)) : '<span class="rmiss">Knowledge of family history not answered</span>') + '</li>';
    if ((s1.knowledge === 'some' || s1.knowledge === 'little') && (s1.maternalUnknown || s1.paternalUnknown || s1.explain)) {
      var u = []; if (s1.maternalUnknown) u.push('maternal side unknown'); if (s1.paternalUnknown) u.push('paternal side unknown');
      h += '<li>' + esc(u.join(', ') + (s1.explain ? (u.length ? '. ' : '') + s1.explain : '')) + '</li>';
    }
    relList().forEach(function (r) {
      var v = getP(S, r.path), sum = relSummary(v, r.kind);
      h += '<li>' + esc(r.title) + ': ' + (sum ? esc(sum) + (v.conditions === 'yes' && v.conditionsText ? ' (' + esc(v.conditionsText) + ')' : '') + (v.status === 'deceased' ? '. Cause of death: ' + esc(v.causeUnknown ? 'unknown' : (v.cause || 'not given')) : '') : '<span class="rmiss">Not answered</span>') +
        (r.kind === 'halfSiblings' && !v.side ? ' <span class="rmiss">(maternal or paternal not answered)</span>' : '') + '</li>';
    });
    function anc(key, who) {
      var a = s1[key];
      if (!a.length) return '<li><span class="rmiss">' + who + ' ancestry not answered</span></li>';
      return '<li>' + who + ' ancestry: ' + esc(a.map(function (v) { return v === 'other' && s1[key + 'Other'] ? 'Other (' + s1[key + 'Other'] + ')' : lbl(ANCESTRY, v); }).join(', ')) + '</li>';
    }
    h += anc('ancMother', "Mother's") + anc('ancFather', "Father's");
    h += '<li>Parents related by blood: ' + (s1.consanguinity ? esc(lbl(YNU, s1.consanguinity)) : '<span class="rmiss">Not answered</span>') + '</li></ul></div>';
    // Groups
    GROUPS.forEach(function (g) {
      var ans = S.groups[g.id], lines = [];
      g.conds.forEach(function (c, ci) {
        var a = ans[ci];
        if (!a.answer) lines.push('<li class="rmiss">' + esc(c.label) + ': not answered</li>');
        else if (a.answer === 'unsure') lines.push('<li><span class="tag unsure">Unsure</span>' + esc(c.label) + (a.unsureNote ? ': ' + esc(a.unsureNote) : '') + '</li>');
        else if (a.answer === 'yes') lines.push('<li><span class="tag">Yes</span>' + esc(c.label) + '<ul>' + a.entries.map(function (e) { return '<li' + (e.relative ? '' : ' class="rmiss"') + '>' + esc(entrySummary(c, e)) + '</li>'; }).join('') + '</ul></li>');
      });
      h += '<div class="rsec"><div class="rsec-head"><h3>' + g.section + '. ' + esc(g.title) + '</h3>' + editLink(g.section, 'Section ' + g.section) + '</div>' +
        (lines.length ? '<ul>' + lines.join('') + '</ul>' : '<p style="margin:6px 0 0">No known history.</p>') + '</div>';
    });
    // Section 16
    var s = S.s16;
    function yn(v, t) { return v ? esc(lbl(YNU, v)) + (v === 'yes' && t ? ': ' + esc(t) : '') : '<span class="rmiss">Not answered</span>'; }
    h += '<div class="rsec"><div class="rsec-head"><h3>16. Additional Questions</h3>' + editLink(16, 'Section 16') + '</div><ul>' +
      '<li>Other genetic testing results: ' + yn(s.q1, s.q1Text) + '</li>' +
      '<li>Condition in several generations: ' + yn(s.q2, s.q2Text) + '</li>' +
      '<li>Other relevant information: ' + (s.q3 ? esc(s.q3) : 'None provided') + '</li></ul></div>';
    // Confirmations
    h += '<h2>Confirm</h2>';
    h += checkbox('confirm1', "I confirm the information I've provided is accurate and complete to the best of my knowledge.");
    h += checkbox('confirm2', 'I understand I may be asked for more information during medical and genetic screening, and that I should tell Venus Egg Donation if I learn of new medical diagnoses in my biological family, including after donation.');
    if (UI.showIssues && (!S.confirm1 || !S.confirm2)) h += '<p class="alert warn" role="alert">Please check both boxes above to submit.</p>';
    if (UI.submitError) h += '<div class="alert warn" role="alert">' + esc(UI.submitError) + ' Your answers are still saved on this device. <button type="button" class="linkbtn" data-act="submit">Try again</button></div>';
    h += '<p class="footnote">This questionnaire is reviewed by qualified medical and genetics professionals. It does not replace the medical, genetic, and psychological screening performed by your fertility clinic.</p>';
    return h;
  }

  /* ---------------- Payload ---------------- */
  function num(v) { return v === '' || v == null ? null : Number(v); }
  function relOut(r, item) {
    var o = { relationship: item.rel, label: item.title, vitalStatus: r.status || null,
      age: r.ageUnknown ? 'unknown' : num(r.age), ageType: r.status === 'deceased' ? 'age_at_death' : 'current_age',
      majorHealthConditions: r.conditions || null, majorHealthConditionsDetails: r.conditions === 'yes' ? r.conditionsText : '' };
    if (r.status === 'deceased') o.causeOfDeath = r.causeUnknown ? 'unknown' : (r.cause || null);
    if (item.kind === 'halfSiblings') o.side = r.side || null;
    if (item.kind === 'matAU' || item.kind === 'patAU') o.auntOrUncle = r.relation || null;
    return o;
  }
  function entryOut(c, e) {
    var o = { relative: e.relative || null, relativeLabel: e.relative ? lbl(RELATIVES, e.relative) : null };
    if (e.relative === 'other') o.relativeOther = e.relativeOther;
    var age = e.ageMode === 'age' ? num(e.age) : e.ageMode === 'birth' ? 'present_at_birth' : e.ageMode === 'unknown' ? 'unknown' : null;
    if (c.ex.gentle) { o.ageAtTime = age; o.additionalDetails = e.details; return o; }
    o.diagnosis = e.diagnosis; o.ageAtDiagnosis = age; o.causeKnown = e.cause || null; o.currentStatus = e.status || null;
    if (c.ex.deathAge) o.ageAtDeath = e.ageAtDeathUnknown ? 'unknown' : num(e.ageAtDeath);
    if (c.ex.onset) o.onset = e.onset || null;
    if (c.ex.eyes) o.eyesAffected = e.eyes || null;
    if (c.ex.ears) o.earsAffected = e.ears || null;
    if (c.ex.cleft) { o.cleftType = e.cleftType || null; o.partOfDiagnosedSyndrome = e.cleftSyndrome || null; }
    if (c.ex.cancer) o.cancerCount = e.cancerCount || null;
    if (c.ex.breast) o.breastsAffected = e.breastSide || null;
    if (c.ex.mental) o.hospitalized = e.hospitalized || null;
    o.geneticTesting = e.genTest || null; o.geneticTestingResults = e.genTest === 'yes' ? e.genTestResult : '';
    o.additionalDetails = e.details;
    return o;
  }
  function buildPayload() {
    var s1 = S.s1;
    return {
      form: 'venus_egg_donation_family_medical_history', schemaVersion: 1, submittedAt: new Date().toISOString(),
      section1_biologicalFamily: {
        knowledgeLevel: s1.knowledge || null,
        maternalSideUnknown: s1.knowledge !== 'most' && !!s1.maternalUnknown,
        paternalSideUnknown: s1.knowledge !== 'most' && !!s1.paternalUnknown,
        unavailableInformation: s1.knowledge !== 'most' ? s1.explain : '',
        relatives: relList().map(function (item) { return relOut(getP(S, item.path), item); }),
        ancestry: { mother: s1.ancMother.slice(), motherOther: s1.ancMother.indexOf('other') > -1 ? s1.ancMotherOther : '',
          father: s1.ancFather.slice(), fatherOther: s1.ancFather.indexOf('other') > -1 ? s1.ancFatherOther : '' },
        parentsRelatedByBlood: s1.consanguinity || null
      },
      conditionSections: GROUPS.map(function (g) {
        return { section: g.section, id: g.id, title: g.title, question: g.q,
          conditions: g.conds.map(function (c, ci) {
            var a = S.groups[g.id][ci];
            return { id: c.id, label: c.label, conditionType: c.type === 'L' ? 'LIFELONG' : 'TREATABLE', answer: a.answer || null,
              unsureNote: a.answer === 'unsure' ? a.unsureNote : '',
              affectedRelatives: a.answer === 'yes' ? a.entries.map(function (e) { return entryOut(c, e); }) : [] };
          }) };
      }),
      section16_additional: {
        otherGeneticTestingFindings: S.s16.q1 || null, otherGeneticTestingDetails: S.s16.q1 === 'yes' ? S.s16.q1Text : '',
        conditionInSeveralGenerations: S.s16.q2 || null, conditionInSeveralGenerationsDetails: S.s16.q2 === 'yes' ? S.s16.q2Text : '',
        otherRelevantInformation: S.s16.q3
      },
      confirmations: { accurateAndComplete: !!S.confirm1, understandsFollowUpAndUpdates: !!S.confirm2 }
    };
  }

  /* ---------------- Screens ---------------- */
  var app = document.getElementById('app');
  function header(step) {
    var pct = Math.round(step / TOTAL * 100);
    return '<p class="eyebrow">Section ' + step + ' of ' + TOTAL + '</p>' +
      '<div class="progress" role="progressbar" aria-label="Questionnaire progress" aria-valuemin="0" aria-valuemax="' + TOTAL + '" aria-valuenow="' + step + '" aria-valuetext="Section ' + step + ' of ' + TOTAL + '"><span style="width:' + pct + '%"></span></div>' +
      '<h1 tabindex="-1" id="stepTitle">' + esc(stepTitle(step)) + '</h1>';
  }
  function nav(step) {
    var nextBtn;
    if (step === 17) nextBtn = '<button type="button" class="btn" id="btn_submit" data-act="submit"' + (UI.submitting ? ' aria-disabled="true"' : '') + '>' + (UI.submitting ? 'Submitting…' : 'Submit') + '</button>';
    else {
      var blocked = step >= 2 && step <= 15 && groupAnswered(GROUPS[step - 2]) < GROUPS[step - 2].conds.length;
      nextBtn = '<button type="button" class="btn" id="btn_next" data-act="next"' + (blocked ? ' aria-disabled="true"' : '') + '>Next</button>';
    }
    return '<div class="nav"><button type="button" class="btn secondary" id="btn_prev" data-act="prev">Previous</button>' + nextBtn + '</div>';
  }
  function renderIntro() {
    return '<h1 tabindex="-1" id="stepTitle">Family Medical History</h1><div class="card-intro"><p style="margin:0">Please answer these questions about your biological family\'s health to the best of your knowledge. \'Biological family\' means relatives related to you by birth: parents, siblings, half-siblings, grandparents, aunts, uncles, cousins, and your own children. Answer \'Unsure\' if you don\'t know. Unknown information is never treated as \'No.\' This questionnaire does not replace the medical and genetic screening performed by your fertility clinic.</p></div>' +
      (hasSaved ? '<p class="alert info">Welcome back. Your earlier answers were saved on this device.</p>' : '') +
      '<button type="button" class="btn block" id="btn_begin" data-act="begin">' + (hasSaved ? 'Continue where I left off' : 'Begin') + '</button>' +
      (hasSaved ? '<p style="text-align:center;margin-top:10px"><button type="button" class="linkbtn danger" data-act="startOver">Start over</button></p>' : '');
  }
  function renderDone() {
    return '<h1 tabindex="-1" id="stepTitle">Thank you</h1><p class="alert ok">Thank you. Your family medical history has been submitted.</p>' +
      (IN_JOTFORM ? '<p>Please continue with the rest of your application. If you need to change anything before you send your full application, you can still edit your answers.</p><button type="button" class="btn secondary" data-act="editAfter">Edit my answers</button>' : '');
  }
  function render() {
    var st = S.step, h;
    if (st === 0) h = renderIntro();
    else if (st === 18) h = renderDone();
    else {
      h = header(st);
      if (st === 1) h += renderS1();
      else if (st <= 15) h += renderGroup(GROUPS[st - 2]);
      else if (st === 16) h += renderS16();
      else h += renderReview();
      h += nav(st);
    }
    app.innerHTML = h;
  }
  function rerender() {
    var a = document.activeElement, id = a && a.id;
    render();
    if (id) { var el = document.getElementById(id); if (el) try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
    save();
  }
  function go(step, targetId, cardPath) {
    S.step = step; UI.submitError = '';
    if (cardPath) UI.open[cardPath] = true;
    saveNow(); render();
    var target = targetId && document.getElementById(targetId);
    if (target) {
      target.scrollIntoView({ block: 'center' });
      var f = target.matches('button,input,select,textarea') ? target : target.querySelector('button,input,select,textarea');
      if (f) try { f.focus({ preventScroll: true }); } catch (e) {}
    } else {
      document.getElementById('top').scrollIntoView({ block: 'start' });
      var t = document.getElementById('stepTitle'); if (t) try { t.focus({ preventScroll: true }); } catch (e) {}
    }
    if (step >= 1 && step <= 17) announce('Section ' + step + ' of ' + TOTAL + ': ' + stepTitle(step));
  }

  /* ---------------- Submission ---------------- */
  function submit() {
    if (UI.submitting) return;
    var iss = issues();
    UI.showIssues = true;
    if (iss.length || !S.confirm1 || !S.confirm2) {
      rerender();
      var el = document.getElementById(iss.length ? 'issues' : 'f_confirm1');
      if (el) { el.scrollIntoView({ block: 'center' }); if (!iss.length) el.focus({ preventScroll: true }); }
      return;
    }
    var payload = buildPayload();
    if (IN_JOTFORM) {
      try { window.JFCustomWidget.sendData({ value: JSON.stringify(payload) }); } catch (e) {}
      S.completed = true; saveNow(); go(18);
      return;
    }
    if (!SUBMISSION_ENDPOINT_URL || SUBMISSION_ENDPOINT_URL === 'SUBMISSION_ENDPOINT_URL') {
      UI.submitError = 'Submission is not set up yet (no endpoint configured).'; rerender(); return;
    }
    UI.submitting = true; UI.submitError = ''; rerender();
    fetch(SUBMISSION_ENDPOINT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
      .then(function () { UI.submitting = false; clearSaved(); S = freshState(); hasSaved = false; S.step = 18; render(); var t = document.getElementById('stepTitle'); if (t) t.focus(); document.getElementById('top').scrollIntoView(); })
      .catch(function () { UI.submitting = false; UI.submitError = 'Something went wrong and your answers were not submitted.'; rerender(); });
  }

  /* ---------------- Events ---------------- */
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-set],[data-toggle],[data-act]');
    if (!b || !app.contains(b)) return;
    if (b.hasAttribute('data-set')) {
      var path = b.getAttribute('data-set'), val = b.getAttribute('data-val');
      setP(S, path, val);
      var m = path.match(/^groups\.(\w+)\.(\d+)\.answer$/);
      if (m && val === 'yes') { var A = S.groups[m[1]][+m[2]]; if (!A.entries.length) A.entries.push(blankEntry()); }
      rerender(); return;
    }
    if (b.hasAttribute('data-toggle')) {
      var tp = b.getAttribute('data-toggle'), tv = b.getAttribute('data-val'), arr = getP(S, tp), i = arr.indexOf(tv);
      if (i > -1) arr.splice(i, 1); else arr.push(tv);
      rerender(); return;
    }
    var act = b.getAttribute('data-act');
    if (b.tagName === 'A') ev.preventDefault();
    switch (act) {
      case 'begin': go(hasSaved ? resumeStep : 1); break;
      case 'startOver':
        if (window.confirm('Start over? This clears the answers saved on this device.')) { clearSaved(); S = freshState(); hasSaved = false; resumeStep = 1; UI = { open: {}, tried: {}, submitting: false, submitError: '', showIssues: false }; render(); }
        break;
      case 'prev': go(S.step - 1); break;
      case 'next':
        if (b.getAttribute('aria-disabled') === 'true') {
          UI.tried[S.step] = true; render();
          var g = GROUPS[S.step - 2], ci = S.groups[g.id].findIndex(function (a) { return !a.answer; });
          var first = document.getElementById('cond_' + g.conds[ci].id);
          if (first) { first.scrollIntoView({ block: 'center' }); var fb = first.querySelector('button'); if (fb) fb.focus({ preventScroll: true }); }
          announce('Please answer the items marked in red.');
        } else go(S.step + 1);
        break;
      case 'noAll':
        S.groups[b.getAttribute('data-group')].forEach(function (a) { a.answer = 'no'; });
        rerender(); announce('All conditions in this section marked No. You can still change any answer.'); break;
      case 'addEntry': getP(S, b.getAttribute('data-path')).push(blankEntry()); rerender(); break;
      case 'removeEntry':
        if (window.confirm('Remove this family member entry?')) { getP(S, b.getAttribute('data-path')).splice(+b.getAttribute('data-idx'), 1); rerender(); }
        break;
      case 'addRel': {
        var key = b.getAttribute('data-list'), list = S.s1[key];
        list.push(blankRel(key === 'halfSiblings' ? { side: '' } : (key === 'matAU' || key === 'patAU') ? { relation: '' } : null));
        UI.open['s1.' + key + '.' + (list.length - 1)] = true; rerender();
        var nb = document.getElementById('card_' + pid('s1.' + key + '.' + (list.length - 1)) + '_btn'); if (nb) nb.focus();
        break;
      }
      case 'removeRel': {
        var k = b.getAttribute('data-list'), idx = +b.getAttribute('data-idx');
        if (window.confirm('Remove this relative?')) {
          S.s1[k].splice(idx, 1);
          var newOpen = {}; for (var p in UI.open) if (p.indexOf('s1.' + k + '.') !== 0) newOpen[p] = UI.open[p];
          UI.open = newOpen; rerender(); var ab = document.getElementById('add_' + k); if (ab) ab.focus();
        }
        break;
      }
      case 'toggleCard': { var cp = b.getAttribute('data-path'); UI.open[cp] = !UI.open[cp]; rerender(); break; }
      case 'jump': { var t = document.getElementById(b.getAttribute('data-target')); if (t) { t.scrollIntoView({ block: 'center' }); var tb = t.querySelector('button'); if (tb) tb.focus({ preventScroll: true }); } break; }
      case 'goto': go(+b.getAttribute('data-step'), b.getAttribute('data-target'), b.getAttribute('data-card')); break;
      case 'submit': submit(); break;
      case 'editAfter': S.completed = false; try { window.JFCustomWidget.sendData({ value: '' }); } catch (e) {} go(17); break;
    }
  });
  app.addEventListener('input', function (ev) {
    var t = ev.target, p = t.getAttribute && t.getAttribute('data-bind');
    if (!p || t.type === 'checkbox' || t.tagName === 'SELECT') return;
    setP(S, p, t.value); save();
  });
  app.addEventListener('change', function (ev) {
    var t = ev.target, p = t.getAttribute && t.getAttribute('data-bind');
    if (!p) return;
    if (t.type === 'checkbox') { setP(S, p, t.checked); rerender(); }
    else if (t.tagName === 'SELECT') { setP(S, p, t.value); rerender(); }
    else if (t.type === 'number') { rerender(); }
  });
  window.addEventListener('pagehide', saveNow);

  /* ---------------- Jotform integration ---------------- */
  if (IN_JOTFORM) {
    var JF = window.JFCustomWidget;
    var resize = function () { try { JF.requestFrameResize({ height: Math.ceil(document.documentElement.scrollHeight) + 8 }); } catch (e) {} };
    if (window.ResizeObserver) new ResizeObserver(resize).observe(document.body); else setInterval(resize, 800);
    JF.subscribe('ready', function () {
      if (S.completed && !issues().length && S.confirm1 && S.confirm2) { try { JF.sendData({ value: JSON.stringify(buildPayload()) }); } catch (e) {} }
      resize();
    });
    JF.subscribe('submit', function () {
      var ok = S.completed && !issues().length && S.confirm1 && S.confirm2;
      var value = ok ? JSON.stringify(buildPayload()) : '';
      // Jotform also fires this on its own "Next" button, so the device copy is not cleared here.
      // Completed questionnaires are cleared from the device automatically after 7 days (see loadSaved).
      JF.sendSubmit({ valid: ok, value: value });
    });
  }

  render();
})();
</script>
</body>
</html>
